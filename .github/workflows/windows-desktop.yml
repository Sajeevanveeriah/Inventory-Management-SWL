name: Windows desktop

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          rustup override set 1.89.0-x86_64-pc-windows-msvc
      - name: Prove active Rust toolchain and components
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version
          rustup component list --installed --toolchain 1.89.0-x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run verify
      - run: npm run check:data-safety
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - run: npm run desktop:build
      - name: Create SHA-256 manifest
        shell: pwsh
        run: Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swl-windows-unsigned-internal-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
