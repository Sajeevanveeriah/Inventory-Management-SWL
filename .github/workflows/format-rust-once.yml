name: Format Rust once

on:
  push:
    branches: [agent/real-competitor-api]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/real-competitor-api
          fetch-depth: 0
      - name: Install the pinned formatter
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt
          rustup override set 1.89.0
      - name: Format and commit Rust sources
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git diff --cached --quiet && { echo "No Rust formatting changes were required."; exit 1; }
          git commit -m "Apply pinned Rust formatting"
          git push origin HEAD:agent/real-competitor-api
