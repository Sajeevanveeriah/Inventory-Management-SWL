name: Deploy to GitHub Pages

# Builds the production bundle and publishes dist/ to GitHub Pages.
# Pages must serve the BUILT app, not the raw repository: the source
# index.html references /src/main.tsx, which only exists in dev.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Isolate private environment from the public Pages build
        shell: bash
        run: |
          pages_index="$RUNNER_TEMP/pages-public.index"
          GIT_INDEX_FILE="$pages_index" git read-tree HEAD
          GIT_INDEX_FILE="$pages_index" git rm --cached --quiet --ignore-unmatch \
            .env .env.local .env.production .env.production.local
          rm -f -- .env .env.local .env.production .env.production.local
          echo "GIT_INDEX_FILE=$pages_index" >> "$GITHUB_ENV"
          test ! -e .env
          test ! -e .env.local
          test ! -e .env.production
          test ! -e .env.production.local
          test "$(GIT_INDEX_FILE="$pages_index" git ls-files -- \
            .env .env.local .env.production .env.production.local)" = ""
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Project pages are served from /<repo>/, so Vite needs that base.
          VITE_BASE: /Inventory-Management-SWL/
          # Pages has no Node process; approved demo records are session-only.
          VITE_STATIC_DEMO: "true"
          # Exact API-only Vercel origin. The frontend remains on GitHub Pages.
          VITE_LIVE_SEARCH_API_ORIGIN: https://swl-competitor-api-sajeevan-veeriahs-projects.vercel.app
          # Fail closed instead of publishing a manual-only Pages bundle.
          VITE_REQUIRE_LIVE_SEARCH_API_ORIGIN: "true"
      - run: npm run check:pages
        env:
          VITE_LIVE_SEARCH_API_ORIGIN: https://swl-competitor-api-sajeevan-veeriahs-projects.vercel.app
          VITE_REQUIRE_LIVE_SEARCH_API_ORIGIN: "true"
      # actions/configure-pages v6.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # actions/upload-pages-artifact v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
