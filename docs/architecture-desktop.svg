  <text x="760" y="828" class="text">executes</text>
  <rect x="945" y="775" width="240" height="80" rx="12" class="gate" />
  <text x="1065" y="803" class="text">Native services</text>
  <text x="1065" y="828" class="text">and recovery</text>
  <rect x="1260" y="735" width="230" height="70" rx="12" class="gate" />
  <text x="1375" y="758" class="text">Installed Windows</text>
  <text x="1375" y="783" class="text">acceptance</text>
  <rect x="1260" y="855" width="230" height="70" rx="12" class="gate" />
  <text x="1375" y="878" class="text">Correct PR</text>
  <text x="1375" y="903" class="text">evidence</text>

  <path d="M260 815 H335" class="edge" />
