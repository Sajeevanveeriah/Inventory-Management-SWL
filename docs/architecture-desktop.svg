<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">SWL desktop architecture and pull-request evidence flow</title>
  <desc id="description">Two implementation and acceptance flows. Local files enter the shared React interface, pure TypeScript rules and the platform adapter. Desktop calls go through scoped Tauri commands to SQLite, native import and export, and an allowlisted HTTPS provider. The server-backed web demonstration uses the existing Node adapter, while static Pages uses a no-network session-only store. Pull request 13 provisions pinned Rust tools, executes the configured gates, completes native recovery, runs installed Windows acceptance and records truthful evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #0f766e; stroke-width: 3; }
      .decision { fill: #ecfeff; stroke: #0f766e; stroke-width: 3; }
      .gate { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; }
      .text { font: 600 19px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .label { font: 600 16px system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff" />
  <text x="800" y="50" class="title" text-anchor="middle">Implemented SWL architecture</text>
  <rect x="45" y="80" width="1510" height="520" rx="18" class="panel" />

  <rect x="90" y="255" width="210" height="80" rx="12" class="node" />
  <text x="195" y="295" class="text">Local CSV/XLSX</text>
  <rect x="380" y="255" width="220" height="80" rx="12" class="node" />
  <text x="490" y="295" class="text">Shared React UI</text>
  <rect x="680" y="125" width="250" height="80" rx="12" class="node" />
  <text x="805" y="165" class="text">Pure TypeScript rules</text>
  <path d="M805 245 L930 295 L805 345 L680 295 Z" class="decision" />
  <text x="805" y="295" class="text">Platform adapter</text>
  <rect x="1010" y="255" width="250" height="80" rx="12" class="node" />
  <text x="1135" y="295" class="text">Scoped Tauri commands</text>
  <rect x="1320" y="115" width="200" height="80" rx="12" class="node" />
  <text x="1420" y="145" class="text">SQLite in</text>
  <text x="1420" y="170" class="text">app data</text>
  <rect x="1320" y="255" width="200" height="80" rx="12" class="node" />
  <text x="1420" y="285" class="text">Native</text>
  <text x="1420" y="310" class="text">import/export</text>
  <rect x="1320" y="395" width="200" height="80" rx="12" class="node" />
  <text x="1420" y="425" class="text">Allowlisted HTTPS</text>
  <text x="1420" y="450" class="text">provider</text>
  <rect x="680" y="455" width="250" height="80" rx="12" class="node" />
  <text x="805" y="485" class="text">Existing Node</text>
  <text x="805" y="510" class="text">adapter</text>
  <rect x="1000" y="455" width="250" height="80" rx="12" class="node" />
  <text x="1125" y="485" class="text">Static Pages</text>
  <text x="1125" y="510" class="text">session-only store</text>

