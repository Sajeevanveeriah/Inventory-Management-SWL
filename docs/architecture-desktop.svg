  <path d="M600 275 C640 250 650 165 680 165" class="edge" />
  <path d="M600 315 H680" class="edge" />
  <path d="M930 295 H1010" class="edge" />
  <text x="970" y="279" class="label">Desktop</text>
  <path d="M1260 275 C1290 250 1290 155 1320 155" class="edge" />
  <path d="M1260 295 H1320" class="edge" />
  <path d="M1260 315 C1290 340 1290 435 1320 435" class="edge" />
  <text x="1290" y="382" class="label">Explicit search</text>
  <path d="M805 345 V455" class="edge" />
