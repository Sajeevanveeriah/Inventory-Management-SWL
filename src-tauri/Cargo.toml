[package]
name = "swl-pricing-desktop"
version = "1.0.0"
description = "SWL Pricing and Inventory Control - Windows desktop shell"
authors = ["Stan Wootton Locksmiths"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "swl_pricing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
